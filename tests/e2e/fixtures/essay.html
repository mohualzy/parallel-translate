<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Essay Fixture</title>
  </head>
  <body>
    <!-- 老式文章页：整篇正文包在一个 <font> 里，段落之间用 <br><br> 分隔 -->
    <table>
      <tr>
        <td id="essay-cell">
          <font id="essay" size="2" face="verdana">
            July 2023<br /><br />
            The first paragraph explains the idea in plain words.<br /><br />
            The second paragraph has a <a href="#note-1" id="note-link">footnote</a> and continues<br />on a soft line break.<br /><br />
            <span style="display: inline-block; height: 4000px"></span><br /><br />
            The far paragraph should wait until the reader scrolls here.
          </font>
        </td>
      </tr>
    </table>
  </body>
</html>
