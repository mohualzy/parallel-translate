<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Interactive page</title>
  </head>
  <body>
    <!-- 仿 Kubernetes 侧栏：复选框 + label 控制子列表展开，label 不能被藏起来 -->
    <ul>
      <li id="side-sec">
        <input type="checkbox" id="side-toggle" />
        <label for="side-toggle" id="side-label">Concepts and architecture</label>
        <ul>
          <li id="side-sub"><a href="/overview" id="side-sub-link">Overview of the system</a></li>
        </ul>
      </li>
    </ul>
    <!-- 仿 Kubernetes 侧栏另一种分组标题：label 里只有链接，展开三角画在 label 上；只藏链接，label 留着 -->
    <style>
      #side-link-label::before { content: '▸'; padding-right: 4px; }
      #side-link-label { display: inline-block; }
      .sidebar-link { display: block; }
    </style>
    <ul>
      <li id="side-link-sec">
        <input type="checkbox" id="side-link-toggle" style="display: none" />
        <label for="side-link-toggle" id="side-link-label"><a href="/cluster" id="side-link" class="sidebar-link">Cluster architecture</a></label>
        <ul>
          <li><a href="/nodes">Nodes and their lifecycle</a></li>
        </ul>
      </li>
    </ul>
    <!-- 仿 Python 文档页头：label 里有下拉框，整段藏会把下拉框一起藏掉 -->
    <div id="theme-row"><label id="theme-label">Theme <select id="theme-select"><option>Auto</option><option>Light</option><option>Dark</option></select></label></div>
    <!-- 仿 GitHub 顶部导航：按钮里是「文字 + 块级图标」，图标按 em 定大小 -->
    <nav>
      <button type="button" id="icon-btn" style="display: flex; align-items: center; font-size: 20px">
        Platform overview<svg id="icon-btn-svg" style="display: block; width: 1em; height: 1em" viewBox="0 0 16 16"><path d="M4 6l4 4 4-4" /></svg>
      </button>
    </nav>
    <!-- 仿单页应用：页面脚本拦截链接点击，自己处理路由（不整页跳转） -->
    <p id="spa-p"><a href="/dashboard" id="spa-link">Open the project dashboard</a></p>
    <script>
      document.getElementById('spa-link').addEventListener('click', (e) => {
        e.preventDefault();
        document.body.dataset.routed = (Number(document.body.dataset.routed) || 0) + 1;
      });
    </script>
  </body>
</html>
