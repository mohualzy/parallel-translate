<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF 双语阅读</title>
  </head>
  <body>
    <header class="toolbar">
      <strong id="doc-title" class="doc-title">PDF 双语阅读</strong>
      <div class="segmented" id="mode" role="group" aria-label="显示方式">
        <button type="button" data-value="bilingual">双语并排</button>
        <button type="button" data-value="translation">仅译文</button>
        <button type="button" data-value="original">仅原文</button>
      </div>
      <label class="inline">风格 <select id="profile"></select></label>
      <label class="inline">中文字体 <select id="cjk-font"></select></label>
      <div class="zoom">
        <button type="button" class="btn" id="zoom-out" aria-label="缩小">−</button>
        <span id="zoom-label">100%</span>
        <button type="button" class="btn" id="zoom-in" aria-label="放大">＋</button>
      </div>
      <span id="progress" class="muted"></span>
      <button type="button" class="btn" id="hl-toggle" aria-pressed="false" title="列出、跳转、导出这篇文档的强调">强调 0</button>
      <button type="button" class="btn" id="retry" hidden>重试失败的段落</button>
      <button type="button" class="btn" id="export" disabled title="导出译文 PDF 或左右对照的双语 PDF">导出 PDF</button>
      <button type="button" class="btn" id="original" hidden title="用浏览器自带的查看器打开原 PDF">原文件</button>
      <button type="button" class="btn" id="open">打开本地文件</button>
      <input type="file" id="file" accept="application/pdf,.pdf" hidden />
    </header>

    <p id="notice" class="notice" hidden></p>

    <main id="pages" class="pages"></main>

    <dialog id="export-dialog" class="export-dialog">
      <h3>导出 PDF</h3>
      <p id="export-info" class="muted"></p>
      <p class="muted">导出的是图片版：文字不能选中，强调会一起导出。</p>
      <div class="export-actions">
        <button type="button" class="btn btn-primary" data-mode="translation">仅译文</button>
        <button type="button" class="btn btn-primary" data-mode="bilingual">双语并排</button>
        <button type="button" class="btn" data-mode="cancel">取消</button>
      </div>
    </dialog>

    <section id="empty" class="empty" hidden>
      <p><strong>把 PDF 拖到这里</strong>，或点右上角「打开本地文件」</p>
      <p class="muted">文件只在本机解析和显示，不会上传；发给翻译服务的只有要翻译的文字。</p>
    </section>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
