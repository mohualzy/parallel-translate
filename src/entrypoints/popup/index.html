<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>双语对照翻译</title>
  </head>
  <body>
    <header class="header">
      <img src="/icon/32.png" alt="" width="20" height="20" />
      <strong>双语对照翻译</strong>
      <button id="open-options" class="icon-btn" title="设置" aria-label="设置">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </header>

    <main>
      <div id="notice" class="notice" hidden></div>

      <button id="toggle" class="btn btn-primary btn-block btn-lg">翻译此页面</button>
      <p id="status" class="status muted"></p>
      <button id="retry" class="btn btn-block" hidden></button>
      <details id="terms" class="terms" hidden>
        <summary></summary>
        <ul></ul>
      </details>

      <div class="rows">
        <label class="row">
          <span>目标语言</span>
          <select id="target-lang"></select>
        </label>
        <label class="row">
          <span>翻译服务</span>
          <select id="provider"></select>
        </label>
        <label class="row" title="只对当前网站生效">
          <span>翻译风格</span>
          <select id="profile"></select>
        </label>
        <div class="row">
          <span>显示方式</span>
          <div class="segmented" id="display-mode">
            <button type="button" data-value="bilingual">双语对照</button>
            <button type="button" data-value="translation">仅译文</button>
          </div>
        </div>
        <label class="row">
          <span>译文样式</span>
          <select id="style"></select>
        </label>
      </div>

      <button id="open-side-panel" class="btn btn-block" type="button">在侧栏翻译文本</button>
      <button id="open-pdf" class="btn btn-block" type="button">打开本地 PDF</button>

      <div class="site-rules">
        <label class="check"><input type="checkbox" id="always" /> 总是翻译 <b class="host"></b></label>
        <label class="check"><input type="checkbox" id="never" /> 永不翻译 <b class="host"></b></label>
      </div>
    </main>

    <footer class="footer muted">
      <span id="shortcut-hint"></span>
      <a id="shortcuts">修改快捷键</a>
    </footer>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
